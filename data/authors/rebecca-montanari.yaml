bio: |
  Rebecca Montanari graduated summa cum laude in Electronic Engineering at the University of Bologna in 1996. In 1997-1998 she worked for CryptoNet S.r.l., focusing on security technologies enabling electronic commerce applications. She received her Ph.D. degree in Computer Science Engineering from the Department of Electronics, Computer Science and Systems at the University of Bologna in 2001, with a dissertation on security models for mobile agents. She has been Associate Professor at the University of Bologna since 2005. Her research interests focus on policy-based networking and systems and service management, mobile agent systems, security management mechanisms, and middleware for self-managing and self-adapting distributed services based on semantically enhanced metadata. She has co-authored more than 50 papers in international journals, magazines, books, book chapters, conferences, and workshops, and has participated in technical program committees for numerous international conferences. She has also collaborated with research centers including Nokia Research Center Cambridge, MIT, Imperial College London, and the Institute for Human and Machine Cognition.
