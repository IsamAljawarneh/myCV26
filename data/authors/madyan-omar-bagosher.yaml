bio: |
  Graduated with a BSc in I.T. Multimedia in 2023 and is currently pursuing his MSc in Artificial Intelligence at University of Sharjah. He is also working as a research assistant at University of Sharjah's Department of computing \& Informatics. His interests are mainly geospatial and time-series analysis, applications of generative artificial intelligence in building intelligent systems and multi-objective optimization for smart city applications. In summary, his interests falls at the intersection of algorithmic, geospatial and AI applications for sustainable smart city development.
