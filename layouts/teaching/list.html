{{ define "main" }}
<main class="mx-auto max-w-4xl px-6 py-12">
  <header class="mb-8">
    <h1 class="text-4xl font-bold">{{ .Title }}</h1>
    {{ with .Description }}
      <p class="mt-3 text-lg text-gray-600 dark:text-gray-300">{{ . }}</p>
    {{ end }}
  </header>
  <div class="prose max-w-none dark:prose-invert">
    {{ .Content }}
  </div>
  <div class="mt-10 grid gap-6 md:grid-cols-2">
    {{ range .RegularPages.ByDate.Reverse }}
      {{ if in .Params.tags "unibo" }}
        <article class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800">
          <div class="mb-3 text-sm font-medium uppercase tracking-wide text-blue-600 dark:text-blue-300">University of Bologna</div>
          <h2 class="text-2xl font-semibold text-gray-900 dark:text-white">
            <a class="hover:text-blue-600 dark:hover:text-blue-300" href="{{ .RelPermalink }}">{{ .Title }}</a>
          </h2>
          {{ with .Summary }}
            <p class="mt-3 text-gray-600 dark:text-gray-300">{{ . }}</p>
          {{ end }}
          <a class="mt-6 inline-block font-medium text-blue-600 hover:underline dark:text-blue-300" href="{{ .RelPermalink }}">Read more &rarr;</a>
        </article>
      {{ end }}
    {{ end }}
  </div>
</main>
{{ end }}
