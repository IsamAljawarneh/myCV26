{{ define "main" }}
<main class="mx-auto max-w-4xl px-6 py-12">
  <header class="mb-8">
    <h1 class="text-4xl font-bold">{{ .Title }}</h1>
    {{ with .Description }}
      <p class="mt-3 text-lg text-gray-600 dark:text-gray-300">{{ . }}</p>
    {{ end }}
  </header>
  <div class="prose max-w-none dark:prose-invert">
    {{ .Content }}
  </div>
</main>
{{ end }}
